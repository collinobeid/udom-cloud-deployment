ProxyPreserveHost On

# Collabora WebSocket for real-time collaboration
ProxyPassMatch "^/cool/(.*)/ws$" "ws://localhost:9983/cool/$1/ws" nocanon

# Collabora regular HTTP requests
ProxyPass "/cool" "http://localhost:9983/cool"
ProxyPassReverse "/cool" "http://localhost:9983/cool"

# Collabora discovery and capabilities endpoints
ProxyPass "/hosting/discovery" "http://localhost:9983/hosting/discovery"
ProxyPassReverse "/hosting/discovery" "http://localhost:9983/hosting/discovery"
ProxyPass "/hosting/capabilities" "http://localhost:9983/hosting/capabilities"
ProxyPassReverse "/hosting/capabilities" "http://localhost:9983/hosting/capabilities"
