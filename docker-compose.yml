version: '3.8'

services:
  db:
    image: mariadb:10.11
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=udom_root_password
      - MYSQL_PASSWORD=udom_db_password
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  app:
    image: nextcloud:34.0.3-apache
    restart: always
    ports:
      - 8080:80
    links:
      - db
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      - MYSQL_PASSWORD=udom_db_password
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - NEXTCLOUD_ADMIN_PASSWORD=udom_admin

  ldap:
    image: osixia/openldap:1.5.0
    restart: always
    environment:
      - LDAP_ORGANISATION=UDOM Cloud
      - LDAP_DOMAIN=udom.local
      - LDAP_ADMIN_PASSWORD=udom_ldap_admin
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    ports:
      - "389:389"

volumes:
  db_data:
  nextcloud_data:
  ldap_data:
  ldap_config:
