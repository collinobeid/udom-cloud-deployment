
services:
  db:
    image: mariadb:10.11
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}

  app:
    image: nextcloud:34.0.3-apache
    restart: always
    ports:
      - 8080:80
    links:
      - db
    volumes:
      - nextcloud_data:/var/www/html
      - ./customizations:/var/www/html/custom_assets
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_HOST=db
      # Automatically install Nextcloud without showing the setup screen
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}

  cron:
    image: nextcloud:34.0.3-apache
    restart: always
    volumes:
      - nextcloud_data:/var/www/html
    entrypoint: /cron.sh
    depends_on:
      - db

  ai-setup:
    image: nextcloud:34.0.3-apache
    restart: "no"
    volumes:
      - nextcloud_data:/var/www/html
      - ./scripts/setup-ai.sh:/setup-ai.sh
      - ./patches:/patches
    entrypoint: /bin/sh /setup-ai.sh
    depends_on:
      - app
      - ollama

  ai-worker:
    image: nextcloud:34.0.3-apache
    restart: always
    user: www-data
    volumes:
      - nextcloud_data:/var/www/html
    command: php occ taskprocessing:worker
    depends_on:
      - db

  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama


volumes:
  db_data:
  nextcloud_data:
  ollama_data: