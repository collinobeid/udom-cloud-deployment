
services:
  db:
    image: mariadb:10.11
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}

  app:
    image: nextcloud:34.0.3-apache
    restart: always
    command: /bin/bash -lc "a2enmod proxy proxy_http && apache2-foreground"
    ports:
      - 8080:80
    links:
      - db
    volumes:
      - nextcloud_data:/var/www/html
      - ./customizations:/var/www/html/custom_assets
      - ./customizations/appapi.conf:/etc/apache2/conf-enabled/appapi.conf:ro
      - ./customizations/apache-mods/proxy.load:/etc/apache2/mods-enabled/proxy.load:ro
      - ./customizations/apache-mods/proxy.conf:/etc/apache2/mods-enabled/proxy.conf:ro
      - ./customizations/apache-mods/proxy_http.load:/etc/apache2/mods-enabled/proxy_http.load:ro
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_HOST=db
      # Automatically install Nextcloud without showing the setup screen
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}

  cron:
    image: nextcloud:34.0.3-apache
    restart: always
    volumes:
      - nextcloud_data:/var/www/html
    entrypoint: /cron.sh
    depends_on:
      - db

  ai-setup:
    image: nextcloud:34.0.3-apache
    restart: "no"
    volumes:
      - nextcloud_data:/var/www/html
      - ./scripts/setup-ai.sh:/setup-ai.sh
      - ./patches:/patches
    environment:
      - APPAPI_SHARED_KEY=${APPAPI_SHARED_KEY}
    entrypoint: /bin/sh /setup-ai.sh
    depends_on:
      - app
      - ollama
      - appapi-harp

  security-init:
    image: nextcloud:34.0.3-apache
    restart: "no"
    volumes:
      - nextcloud_data:/var/www/html
      - ./scripts/security-setup.sh:/security-setup.sh
    environment:
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - LDAP_STUDENT_TEST_PASSWORD=${LDAP_STUDENT_TEST_PASSWORD}
      - LDAP_STAFF_TEST_PASSWORD=${LDAP_STAFF_TEST_PASSWORD}
    entrypoint: /bin/bash /security-setup.sh
    depends_on:
      - app
      - ldap
  ai-worker:
    image: nextcloud:34.0.3-apache
    restart: always
    user: www-data
    volumes:
      - nextcloud_data:/var/www/html
    command: php occ taskprocessing:worker
    depends_on:
      - db

  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama

  # ================================================
  # APPAPI HARP PROXY — Secure ExApp Deployment
  # ================================================
  # HaRP manages ExApp containers (like Context Chat Backend)
  # on behalf of Nextcloud's AppAPI without exposing the Docker
  # socket to the Nextcloud application container.
  appapi-harp:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    restart: unless-stopped
    privileged: true
    environment:
      - HP_SHARED_KEY=${APPAPI_SHARED_KEY}
      - NC_INSTANCE_URL=http://app:80
      - HP_LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - harp_certs:/certs
    depends_on:
      - app

  ldap:
    image: osixia/openldap:1.5.0
    restart: always
    environment:
      - LDAP_ORGANISATION=UDOM Cloud
      - LDAP_DOMAIN=udom.local
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    ports:
      - "389:389"

volumes:
  db_data:
  nextcloud_data:
  ldap_data:
  ldap_config:
  ollama_data:
  harp_certs:
